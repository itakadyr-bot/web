<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Ítaka Deporte y Recreación</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/itaka.css">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;background:#0b121b">

<main style="margin:auto;width:100%;max-width:420px;padding:24px">
  <a href="../" style="display:flex;justify-content:center;margin-bottom:26px"><img src="../assets/img/logo-blanco.png" alt="Ítaka Deporte y Recreación" style="height:52px;width:auto"></a>
  <form id="form-acceso" style="background:#fff;border-radius:24px;padding:30px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)">
    <h1 style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;margin:0">Acceso de administración</h1>
    <p style="margin:0 0 4px;font-size:14.5px;line-height:1.5;color:#5b6b7d">Para editar la web. Si has llegado aquí por error, <a href="../">vuelve a la portada</a>.</p>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#3b4a5c">Correo
      <input id="acceso-correo" type="email" required autocomplete="username" placeholder="itakadyr@gmail.com" style="border:1px solid #d8dee4;border-radius:8px;padding:14px 15px;font:500 16px Barlow,sans-serif;color:#14202e">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#3b4a5c">Contraseña
      <input id="acceso-clave" type="password" required autocomplete="current-password" style="border:1px solid #d8dee4;border-radius:8px;padding:14px 15px;font:500 16px Barlow,sans-serif;color:#14202e">
    </label>
    <button type="submit" style="background:#31404f;color:#fff;border:0;border-radius:999px;padding:16px;font:700 16px Barlow,sans-serif;cursor:pointer;margin-top:4px" class="hv3">Entrar</button>
    <p id="acceso-aviso" style="margin:0;font-size:13.5px;line-height:1.5;color:#8494a4"></p>
  </form>
</main>

<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/db.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('form-acceso');
  var aviso = document.getElementById('acceso-aviso');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    aviso.style.color = '#8494a4';
    aviso.textContent = 'Comprobando…';
    window.ITAKA.conCliente().then(function (cliente) {
      return cliente.auth.signInWithPassword({
        email: document.getElementById('acceso-correo').value.trim(),
        password: document.getElementById('acceso-clave').value
      });
    }).then(function (r) {
      if (r.error) throw r.error;
      aviso.style.color = '#14202e';
      aviso.textContent = 'Dentro. Llevándote a la portada…';
      location.href = '../';
    }).catch(function (err) {
      aviso.style.color = '#b42318';
      aviso.textContent = /credential/i.test(err.message || '')
        ? 'Correo o contraseña incorrectos.'
        : 'No se pudo entrar: ' + (err.message || 'error desconocido');
    });
  });
})();
</script>
</body>
</html>
